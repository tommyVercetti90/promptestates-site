<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0d0f" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f4f6f8" media="(prefers-color-scheme: light)">
<meta name="robots" content="noindex, nofollow">
<title>PromptEstates Pro — Dubai market intelligence</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="stylesheet" href="/assets/fonts.css">
<link rel="stylesheet" href="pro.css">
<script>(function(){var t;try{t=localStorage.getItem('pe_theme')}catch(e){}if(t!=='light'&&t!=='dark'){t=matchMedia('(prefers-color-scheme: light)').matches?'light':'dark'}document.documentElement.setAttribute('data-theme',t)})();</script>
</head>
<body>
<div id="gate" class="gate" hidden>
  <form class="gate-box" id="gate-form">
    <img src="/assets/logo-light.svg" alt="PromptEstates" class="gate-logo dark-only" width="120" height="69">
    <img src="/assets/logo.svg" alt="PromptEstates" class="gate-logo light-only" width="120" height="69">
    <h1>Pro</h1>
    <p data-t="gateText"></p>
    <input type="password" id="gate-pass" autocomplete="current-password" required>
    <button type="submit" class="btn" data-t="gateBtn"></button>
    <p class="gate-err" id="gate-err" hidden data-t="gateErr"></p>
  </form>
</div>
<div id="app" hidden>
  <header class="top">
    <a href="#/" class="brand"><img src="/favicon.svg" alt="" width="28" height="28"><b>PromptEstates</b><span>Pro</span></a>
    <nav class="tabs" id="tabs">
      <a href="#/" data-route="market" data-t="navMarket"></a>
      <a href="#/ask" data-route="ask" data-t="navAsk"></a>
      <a href="#/info" data-route="info" data-t="navInfo"></a>
      <a href="#/areas" data-route="areas" data-t="navAreas"></a>
      <a href="#/projects" data-route="projects" data-t="navProjects"></a>
      <a href="#/tx" data-route="tx" data-t="navTx"></a>
      <a href="#/developers" data-route="developers" data-t="navDevs"></a>
    </nav>
    <div class="tools">
      <div class="seg" role="group" aria-label="Units"><button type="button" data-unit="m2">м²</button><button type="button" data-unit="sqft">sq ft</button></div>
      <div class="seg" role="group" aria-label="Language"><button type="button" data-lang="ru">RU</button><button type="button" data-lang="en">EN</button></div>
      <div class="seg" role="group" aria-label="Theme"><button type="button" data-theme-set="light" aria-label="Light">☀︎</button><button type="button" data-theme-set="dark" aria-label="Dark">☾</button></div>
    </div>
  </header>
  <main id="view" class="view" aria-live="polite"></main>
  <footer class="foot" id="foot"></footer>
  <nav class="tabbar" id="tabbar" aria-label="Sections">
    <a href="#/" data-route="market"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg><span data-t="navMarket"></span></a>
    <a href="#/areas" data-route="areas"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2-6-2zM9 4v14M15 6v14"/></svg><span data-t="navAreas"></span></a>
    <a href="#/projects" data-route="projects"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 21V5l8-3v19M12 9l8 3v9M2 21h20M7 8h2M7 12h2M7 16h2M15 15h2"/></svg><span data-t="navProjects"></span></a>
    <a href="#/ask" data-route="ask"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l1.8 4.7L18.5 9.5l-4.7 1.8L12 16l-1.8-4.7L5.5 9.5l4.7-1.8zM19 15l.8 2.2L22 18l-2.2.8L19 21l-.8-2.2L16 18l2.2-.8z"/></svg><span data-t="tabAsk"></span></a>
    <button type="button" id="more-btn" data-route="more" aria-haspopup="dialog"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg><span data-t="navMore"></span></button>
  </nav>
  <div class="sheet" id="sheet" hidden>
    <div class="sheet-bg" data-close></div>
    <div class="sheet-panel" role="dialog" aria-modal="true" aria-labelledby="sheet-h">
      <div class="sheet-grip" aria-hidden="true"></div>
      <div class="sheet-head"><h2 id="sheet-h" data-t="navMore"></h2><button type="button" class="link-btn" data-close data-t="done"></button></div>
      <div class="group">
        <a href="#/info" data-close><span data-t="navInfo"></span></a>
        <a href="#/tx" data-close><span data-t="navTx"></span></a>
        <a href="#/developers" data-close><span data-t="navDevs"></span></a>
      </div>
      <p class="group-h" data-t="settings"></p>
      <div class="group settings">
        <div class="row"><span data-t="unitsL"></span><div class="seg"><button type="button" data-unit="m2">м²</button><button type="button" data-unit="sqft">sq ft</button></div></div>
        <div class="row"><span data-t="langL"></span><div class="seg"><button type="button" data-lang="ru">RU</button><button type="button" data-lang="en">EN</button></div></div>
        <div class="row"><span data-t="themeL"></span><div class="seg"><button type="button" data-theme-set="light" aria-label="Light">☀︎</button><button type="button" data-theme-set="dark" aria-label="Dark">☾</button></div></div>
      </div>
    </div>
  </div>
</div>
<script src="vendor/chart.umd.min.js"></script>
<script src="pro.js"></script>
</body>
</html>
